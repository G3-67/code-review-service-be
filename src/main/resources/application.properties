# ===============================
# Server
# ===============================
server.port=8081

# ===============================
# Application Name (CRITICAL)
# ===============================
spring.application.name=code-review-service

# ===============================
# Eureka Client
# ===============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# If running service in Docker
eureka.client.service-url.defaultZone=http://host.docker.internal:8761/eureka

# If NOT using Docker, comment above and use:
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===============================
# Spring AI - Mistral
# ===============================
spring.ai.mistralai.api-key=mOcExIrP5b2NoB3dKquekQqobsm0RGDp
spring.ai.mistralai.chat.model=mistral-small

# ===============================
# Docker Compose (optional)
# ===============================
spring.docker.compose.enabled=false
